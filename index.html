<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f6f0" />
    <title>Bloom - Your Little Focus Corner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a href="#home" class="brand" data-page="home">
          <span class="brand-flower">✿</span>
          <span>Bloom<span class="brand-light">.</span></span>
        </a>

        <p class="nav-label">YOUR SPACE</p>

        <nav class="navigation" aria-label="Main navigation">
          <button class="nav-item active" data-page="home">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
          </button>
          <button class="nav-item" data-page="tasks">
            <span class="nav-icon">☷</span>
            <span>My Tasks</span>
          </button>
          <button class="nav-item" data-page="focus">
            <span class="nav-icon">◷</span>
            <span>Focus Room</span>
          </button>
          <button class="nav-item" data-page="music">
            <span class="nav-icon">♫</span>
            <span>Music Corner</span>
          </button>
          <button class="nav-item" data-page="journal">
            <span class="nav-icon">▤</span>
            <span>My Journal</span>
          </button>
          <button class="nav-item" data-page="progress">
            <span class="nav-icon">↗</span>
            <span>My Progress</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="sidebar-note">
            <span class="note-flower">✿</span>
            <p class="note-title">A little reminder</p>
            <p>You don't have to do it all today. One little step at a time.</p>
          </div>

          <div class="mini-player">
            <div class="mini-player-top">
              <span class="music-art">♫</span>
              <div class="track-info">
                <span class="track-title">Your focus playlist</span>
                <span class="track-subtitle">Music Corner</span>
              </div>
              <span class="music-status" aria-label="Audio belum diputar"
                >♪</span
              >
            </div>
            <div class="player-progress">
              <span></span>
            </div>
            <button class="text-button" data-page="music">
              Explore your music →
            </button>
          </div>

          <button class="theme-toggle" id="themeToggle">
            <span id="themeIcon">☾</span>
            <span id="themeLabel">Switch to Dark Mode</span>
          </button>

          <p class="sidebar-footer">MADE WITH ♡ FOR YOUR LITTLE DREAMS</p>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button
            class="mobile-menu"
            id="mobileMenu"
            aria-label="Open Navigation"
            aria-expanded="false"
          >
            ☰
          </button>

          <div class="breadcrumb">
            <span>Bloom</span>
            <span class="breadcrumb-divider">/</span>
            <span id="currentPageLabel">Home</span>
          </div>

          <div class="topbar-right">
            <span class="today-label" id="todayDate"></span>
            <div class="avatar" aria-label="Bloom profile">B</div>
          </div>
        </header>

        <div id="pageContent" tabindex="-1">
          <!-- Content is rendered by app.js -->
        </div>

        <footer class="main-footer">
          TAKE YOUR TIME · YOU'RE DOING JUST FINE ✿
        </footer>
      </main>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside
      class="quick-drawer"
      id="quickDrawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="drawerTitle"
      hidden
    >
      <div class="drawer-header">
        <div>
          <p class="section-kicker">A LITTLE SOMETHING</p>
          <h2 id="drawerTitle">Quick Action</h2>
        </div>
        <button class="icon-button" id="closeDrawer" aria-label="Close panel">
          ×
        </button>
      </div>
      <div id="drawerContent"></div>
    </aside>

    <div class="toast" id="toast" role="status" hidden></div>
  </body>
</html>
